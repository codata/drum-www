name: Build Production Release Branch

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-build
  cancel-in-progress: false

jobs:
  build-production-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build for Production Root
        run: npm run build
        env:
          PATH_PREFIX: "/"

      - name: Publish output to production-build branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --force ./_site
          git commit --allow-empty -m "chore: production build from ${{ github.sha }}"
          git push origin HEAD:refs/heads/production-build --force
