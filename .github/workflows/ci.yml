name: Validation Check

on:
  pull_request:
    branches: ["main"]

jobs:
  validate:
    name: Validate Content & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Build
        run: pnpm run build

      - name: Success Message
        if: success()
        run: echo "Validation successful! Content is safe to merge."
