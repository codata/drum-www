# DRUM Ambassador Program Data
# Profile, responsibilities, benefits, and participating members/stakeholders.

role:
  title: "Ambassador Role"
  description: "How ambassadors serve as active metrology liaisons between DRUM and their scientific domains."
  items:
    - text: "Share metrology challenges and topics of interest from your union/community."
    - text: "Relay metrology or technology-related news and events across domains."
    - text: "Report on existing tools, databases, APIs, and digital products."
    - text: "Help identify community and domain-specific use cases and stories."
    - text: "Advocate DRUM activities and support the DRUM digital products/services."
    - text: "Keep an open line of communication with DRUM and <a href='https://cdif.codata.org' target='_blank' rel='noopener noreferrer' class='text-theme-accent font-semibold hover:underline'>Cross Domain Interoperability Framework (CDIF)</a> metrology/technology experts."

profile:
  title: "Ambassador Profile"
  description: "The background, experience, and commitment of a DRUM ambassador."
  items:
    - text: "Union or community leader / influencer with strong metrology expertise."
    - text: "Able to dedicate 30+ minutes per week to DRUM-related topics."
    - text: "Familiar with metadata standards and information technologies."
    - text: "Motivated and interested in shaping digital unit representations."

benefits:
  title: "Key Benefits"
  description: "What participating ambassadors and their member unions gain from the program."
  items:
    - text: "Direct access to a board of metrology and technology experts."
    - text: "Stay informed on the latest developments and best practices regarding Units of Measurement (UoM)."
    - text: "Early access to new tools, databases, web-based Application Programming Interfaces (APIs), and models."
    - text: "Have a direct say in the direction and activities of DRUM and CDIF practices and tools."

