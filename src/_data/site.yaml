pages:
  members:
    title: Task Group Membership
    lead: DRUM brings together international experts in metrology, data standards, and AI/machine intelligence to make units of measurement machine-actionable and AI-ready.
    join:
      title: Get Involved
      description: We welcome cooperation and participation from representatives of International Scientific Unions and Associations.
      cta: Join the Group
      formUrl: https://forms.gle/4TjFBqaNoigK97BJ6
      email: mailto:drum@codata.org
  ambassadors:
    title: DRUM Ambassador Program
    lead: Bridging international scientific unions, metrology institutions, and domain communities to promote digital representation and standardization of units of measurement worldwide.
    join:
      title: Join the Program
      description: We welcome representatives from International Scientific Unions, standard bodies, and research organizations to champion FAIR units in their disciplines.
      cta: Apply or Nominate
      formUrl: https://forms.gle/4TjFBqaNoigK97BJ6
      email: mailto:drum@codata.org?subject=DRUM%20Ambassador%20Inquiry
  resources:
    title: Tools & Resources
    lead: Explore inventories, standards registries, and reference materials designed to make units accessible to humans, machines, and AI systems alike.
  news:
    title: Latest News & Events
    lead: Stay updated with announcements, conference presentations, and publications from the DRUM Task Group.
footer:
  description: The CODATA Digital Representation of Units of Measurement (DRUM) Task Group works to build the foundation for AI-ready data, enabling machine intelligence and global scientific communities to seamlessly parse and compute standardized units.
